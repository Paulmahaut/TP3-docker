name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: paulmahaut/tp-database:latest

      - name: Build et push simple-api
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: true
          tags: paulmahaut/tp-simple-api:latest

      - name: Build et push http-server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: paulmahaut/tp-http-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Ecrire la cle SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/id_rsa
          chmod 400 ~/id_rsa

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ansible
        run: pip install ansible

      - name: Lancer le playbook
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml